name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get or create the signing key
        run: |
          git fetch origin main
          git checkout origin/main -- app/sangha.keystore 2>/dev/null || true
          if [ ! -f app/sangha.keystore ]; then
            keytool -genkeypair -keystore app/sangha.keystore -storepass sanghahome -keypass sanghahome \
              -alias sangha -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sangha Home"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/sangha.keystore
            git commit -m "Add signing key"
            git push origin HEAD:main
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk sangha-home.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sangha Home build ${{ github.run_number }}
          files: sangha-home.apk
          make_latest: true
