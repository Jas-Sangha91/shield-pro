plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jas.shieldhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jas.shieldhome'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField "String", "TMDB_TOKEN", "\"${System.getenv('TMDB_TOKEN') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        shared {
            storeFile file('sangha.keystore')
            storePassword 'sanghahome'
            keyAlias 'sangha'
            keyPassword 'sanghahome'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
